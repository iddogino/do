# XcodeGen spec — run `make project` (or `xcodegen generate`) to produce Do.xcodeproj.
# The generated project is not committed; this file is the source of truth.
name: Do

options:
  bundleIdPrefix: com.iddogino
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  DoKit:
    path: Packages/DoKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Do:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: DoKit
        product: DoCore
      - package: DoKit
        product: MageVL
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Do
        CFBundleDisplayName: Do
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Do. All rights reserved.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [doapp]
        NSAppleEventsUsageDescription: Do uses AppleScript to carry out tasks you ask it to do.
        NSDesktopFolderUsageDescription: Do reads and edits files on your Desktop when a task needs it.
        NSDocumentsFolderUsageDescription: Do reads and edits files in Documents when a task needs it.
        NSDownloadsFolderUsageDescription: Do reads and edits files in Downloads when a task needs it.
        NSRemovableVolumesUsageDescription: Do reads and edits files on external drives when a task needs it.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        DoModelRevision: $(DO_MODEL_REVISION)
    entitlements:
      path: App/Do.entitlements
      properties:
        # Do drives other apps and runs shell commands, which the App Sandbox forbids, so it
        # ships outside the Mac App Store with the hardened runtime and Developer ID.
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DO_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Do
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Do.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  Do:
    build:
      targets:
        Do: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: DoKit/DoCoreTests
    archive:
      config: Release
